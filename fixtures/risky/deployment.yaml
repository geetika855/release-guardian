# Deliberately risky manifest for demo/testing. DO NOT APPLY to a real cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      hostNetwork: true
      containers:
        - name: api
          image: myregistry.local/payments:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              value: supersecret123
            - name: STRIPE_API_KEY
              value: sk-live-abc123
          volumeMounts:
            - name: hostdata
              mountPath: /data
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN", "NET_ADMIN"]
      volumes:
        - name: hostdata
          hostPath:
            path: /var/lib/payments
