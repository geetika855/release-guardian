name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t release-guardian:ci .
      - run: docker run -d --name guardian -p 8000:8000 release-guardian:ci
      - run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break || sleep 3
          done
          curl -sf http://localhost:8000/health | grep -q '"status":"ok"'
      - run: docker stop guardian
